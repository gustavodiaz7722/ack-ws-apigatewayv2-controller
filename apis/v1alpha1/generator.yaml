ignore:
  resource_names:
    # # Model is not supported for HTTP APIs. Remove when adding support for WebSocket APIs
    - Model
    # IntegrationResponse is not supported for HTTP APIs. Remove when adding support for WebSocket APIs
    - IntegrationResponse
    # RouteResponse is not supported for HTTP APIs. Remove when adding support for WebSocket APIs
    - RouteResponse
  field_paths:
    # DomainNameStatus is ignored because it should be a read-only field
    - CreateDomainNameInput.DomainNameConfigurations.DomainNameConfiguration.DomainNameStatus
    - CreateDomainNameInput.DomainNameConfigurations.DomainNameConfiguration.DomainNameStatusMessage
    - CreateDomainNameInput.DomainNameConfigurations.DomainNameConfiguration.ApiGatewayDomainName
    - CreateDomainNameInput.DomainNameConfigurations.DomainNameConfiguration.CertificateUploadDate
    - CreateDomainNameInput.DomainNameConfigurations.DomainNameConfiguration.HostedZoneId

resources:
  Api:
    fields:
      Body:
        is_document: true
        from:
          operation: ImportApi
          path: Body
      Basepath:
        from:
          operation: ImportApi
          path: Basepath
      FailOnWarnings:
        from:
          operation: ImportApi
          path: FailOnWarnings
      Name:
        is_required: false
      ProtocolType:
        is_required: false
    update_operation:
      custom_method_name: customUpdateApi
  Stage:
    hooks:
      sdk_update_post_build_request:
        template_path: hooks/stage/sdk_update_post_build_request.go.tpl
    fields:
      ApiId:
        references:
          resource: API
          path: Status.APIID
      DeploymentId:
        references:
          resource: Deployment
          path: Status.DeploymentID
  Authorizer:
    fields:
      ApiId:
        references:
          resource: API
          path: Status.APIID
      AuthorizerCredentialsArn:
        references:
          resource: Role
          service_name: iam
          path: Status.ACKResourceMetadata.ARN
    tags:
      ignore: true
  Deployment:
    fields:
      ApiId:
        references:
          resource: API
          path: Status.APIID
      StageName:
        references:
          resource: Stage
          path: Spec.StageName
    tags:
      ignore: true
  Integration:
    fields:
      ApiId:
        references:
          resource: API
          path: Status.APIID
      ConnectionId:
        references:
          resource: VPCLink
          path: Status.VPCLinkID
      # NOTE: Spec.CredentialsARN is deliberately left unwired for now. Its
      # documentation describes three options - an IAM role ARN, the literal
      # string arn:aws:iam::*:user/*, or omitting the parameter - so whether it is
      # single-typed is ambiguous on the face of the docs.
      #
      # Probing apigatewayv2 live suggests an IAM role is the only usable type:
      # the arn:aws:iam::*:user/* form is rejected outright ("Invalid role ARN")
      # on both HTTP and WebSocket integrations, and while CreateIntegration does
      # accept any well-formed same-account IAM ARN - including a nonexistent
      # role, a user, and a group - an access point using a user ARN returns HTTP
      # 500 on every request, since API Gateway assumes these credentials and only
      # a role is assumable.
      #
      # That reasoning was not considered settled enough to wire on, so the
      # reference is deferred rather than added. See
      # https://github.com/aws-controllers-k8s/apigatewayv2-controller/pull/131
      # Note Authorizer.AuthorizerCredentialsArn IS wired: its documentation
      # offers only an IAM role or omission, with no equivalent ambiguity.
    tags:
      ignore: true
  Route:
    fields:
      ApiId:
        references:
          resource: API
          path: Status.APIID
      AuthorizerId:
        references:
          resource: Authorizer
          path: Status.AuthorizerID
      Target:
        references:
          resource: Integration
          path: Status.IntegrationID
    hooks:
      references_post_resolve:
        template_path: hooks/route/references_post_resolve.go.tpl
    tags:
      ignore: true
  VpcLink:
    fields:
      SecurityGroupIDs:
        references:
          resource: SecurityGroup
          service_name: ec2
          path: Status.ID
      SubnetIDs:
        references:
          resource: Subnet
          service_name: ec2
          path: Status.SubnetID
    hooks:
      sdk_update_pre_build_request:
        template_path: hooks/vpc_link/sdk_update_pre_build_request.go.tpl
    synced:
      when:
        - path: Status.VPCLinkStatus
          in:
            - AVAILABLE
  DomainName:
    exceptions:
      terminal_codes:
        - BadRequestException
    fields:
      # DomainNameStatus:
      #   is_read_only: true
      #   type: [string]
      # DomainNameStatusMessage:
      #   is_read_only: true
      #   type: string
      DomainName:
        is_primary_key: true        
    tags:
      ignore: true
  ApiMapping:
    exceptions:
      terminal_codes:
        - BadRequestException
    fields:
      ApiId:
        references:
          resource: API
          path: Status.APIID
      DomainName:
        references:
          resource: DomainName
          path: Spec.DomainName
      Stage:
        references:
          resource: Stage
          path: Spec.StageName
    tags:
      ignore: true
operations:
  CreateApi:
    custom_implementation: customCreateApi
